name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿附上 Cookie、访问令牌、真实私信、账号资料或未脱敏的日志。
  - type: input
    id: version
    attributes:
      label: 项目版本与提交
      description: 填写版本号或 commit 短哈希。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本和 DSH 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 描述触发问题所需的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的错误信息
      description: 删除账号标识、Cookie、私信正文、个人路径和服务器地址后再粘贴。
      render: text
